# Extra secret rules for the key material handled in this repo. The builtin
# rules match neither raw hex keys nor EIP-2335 keystores.
rules:
  - id: ethereum-raw-private-key
    category: Ethereum
    title: Raw 32-byte hex key (node key, JWT secret, .env)
    severity: CRITICAL
    regex: '\b(0x)?[0-9a-fA-F]{64}\b'
    # scoped by path, a bare 64-hex also matches block and tx hashes
    path: '(\.key|\.hex)$|(^|/)\.env$'
  - id: eip2335-keystore
    category: Ethereum
    title: EIP-2335 / web3 keystore
    severity: CRITICAL
    regex: '"kdf"\s*:\s*(\{\s*"function"\s*:\s*)?"(scrypt|pbkdf2)"'
    keywords: ["kdf"]
