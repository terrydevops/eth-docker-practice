# rpc gateway in front of the archive node. this is the SLO measurement
# point: availability and latency are defined here, not at the node.
# point reads and heavy traces go to separate pools so one pathological
# trace cannot starve compliance reads (see the README, Architecture and operations).
#
# two-tier freshness gating, because "answers" != "answers correctly":
#   - httpchk asks eth_syncing and requires result:false. a node actively
#     syncing still answers eth_blockNumber, but with a stale head - this
#     catches that and marks it down.
#   - agent-check (the health-sidecar) compares geth's head to besu's and
#     returns a weight, so a node drifting behind sheds traffic *gradually*
#     rather than all-or-nothing. in EKS this logic becomes a readiness probe.
#
# consumers: every request carries an x-api-key that maps to a tenant.
#   prober      internal SLI probes, every method, no limit
#   compliance  eth_* reads on the point pool, 200 requests / 10 s
#   forensics   compliance plus debug_/trace_ on the heavy pool, 50 / 10 s,
#               one heavy request in flight per key
# keys come from the environment (GATEWAY_KEY_*, generated into .env by
# scripts/gen-identities.mjs). node-control methods are refused for everyone.

global
    log stdout format raw local0 info
    maxconn 1024

# re-resolve backend names through docker's dns on every check: a restarted
# container comes back on a new address, and a name resolved once at start
# would keep the old one (seen 2026-09-09, two minutes of 503 after a kill)
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold obsolete 10s

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend rpc
    bind :8548
    option http-buffer-request

    # tenant from the api key
    acl key_prober     req.hdr(x-api-key) -m str "${GATEWAY_KEY_PROBER}"
    acl key_compliance req.hdr(x-api-key) -m str "${GATEWAY_KEY_COMPLIANCE}"
    acl key_forensics  req.hdr(x-api-key) -m str "${GATEWAY_KEY_FORENSICS}"
    http-request set-var(txn.tenant) str(prober)     if key_prober
    http-request set-var(txn.tenant) str(compliance) if key_compliance
    http-request set-var(txn.tenant) str(forensics)  if key_forensics
    http-request capture var(txn.tenant) len 12
    acl known_tenant var(txn.tenant) -m found
    acl tenant_heavy var(txn.tenant) -m str forensics prober

    # method classes, matched on the json-rpc body. a batch with one heavy
    # method counts as heavy
    acl is_forbidden req.body -m reg (admin_|personal_|miner_|txpool_|debug_set|debug_write|debug_free)
    acl is_heavy     req.body -m reg (debug_|trace_)
    acl too_big      req.body_size gt 65536

    http-request return status 401 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32001,"message":"unauthorized: missing or unknown x-api-key"}}' unless known_tenant
    http-request return status 413 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32600,"message":"request body over 64 KiB"}}' if too_big
    http-request return status 403 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32601,"message":"method not available on this endpoint"}}' if is_forbidden
    http-request return status 403 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32601,"message":"debug_ and trace_ need the forensics tier"}}' if is_heavy !tenant_heavy

    # per-key rate limits: requests per 10 s, and heavy requests in flight
    stick-table type string len 64 size 1k expire 1m store http_req_rate(10s),conn_cur
    http-request track-sc0 req.hdr(x-api-key) if known_tenant
    acl over_compliance sc_http_req_rate(0) gt 200
    acl over_forensics  sc_http_req_rate(0) gt 50
    acl heavy_busy      sc_conn_cur(0) gt 1
    http-request return status 429 hdr Retry-After 10 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"rate limit: 200 requests per 10 s"}}' if { var(txn.tenant) -m str compliance } over_compliance
    http-request return status 429 hdr Retry-After 10 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"rate limit: 50 requests per 10 s"}}' if { var(txn.tenant) -m str forensics } over_forensics
    http-request return status 429 hdr Retry-After 5 content-type application/json string '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"one debug_/trace_ request at a time per key"}}' if is_heavy { var(txn.tenant) -m str forensics } heavy_busy

    # method-class routing: debug_/trace_ calls go to the heavy pool
    use_backend archive_heavy if is_heavy
    default_backend archive_point

# health check is eth_syncing, not eth_blockNumber: a node that is up but
# still syncing returns a sync-progress object instead of `false`, and is
# marked down. a synced node returns "result":false and stays in rotation.
# agent-check adds graded weighting on top: the sidecar returns 100% / 50% /
# down as geth's lag against besu grows.
backend archive_point
    option httpchk
    http-check send meth POST uri / ver HTTP/1.1 hdr Host geth hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_syncing\",\"params\":[],\"id\":1}"
    http-check expect rstring "\"result\":false"
    server geth1 geth:8545 check inter 2s fall 3 rise 2 maxconn 64 weight 100 agent-check agent-addr health-sidecar agent-port 9999 agent-inter 2s resolvers docker resolve-prefer ipv4 init-addr libc,none

backend archive_heavy
    timeout server 120s
    option httpchk
    http-check send meth POST uri / ver HTTP/1.1 hdr Host geth hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_syncing\",\"params\":[],\"id\":1}"
    http-check expect rstring "\"result\":false"
    # strict concurrency cap: traces queue rather than saturate the node
    server geth1 geth:8545 check inter 2s fall 3 rise 2 maxconn 2 weight 100 agent-check agent-addr health-sidecar agent-port 9999 agent-inter 2s resolvers docker resolve-prefer ipv4 init-addr libc,none

# stats page for observing server state / weight (used by the lag-shedding demo)
frontend stats
    bind :8406
    stats enable
    stats uri /
    stats refresh 5s

frontend metrics
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }
    no log
